<style>

.tabs{display:flex;gap:6px;margin:4px 0 6px}
.tabs button{flex:1 1 0;min-width:0;padding:8px 4px;font-size:13px;line-height:1.2;text-align:center;white-space:normal}

#zb button{padding:4px 12px;font-size:18px;line-height:1.2}#zb span{min-width:46px;text-align:center;font-size:12px;color:var(--mu)}
.bt{display:flex;align-items:center}.bn{position:relative}.bk{display:flex;flex-direction:column;justify-content:center}
.bk>.bn{padding:3px 14px 3px 0;display:flex;justify-content:flex-end}.bk>.bn::after{content:'';position:absolute;right:0;top:50%;width:14px;border-top:1px solid var(--bd)}
.bk>.bn::before{content:'';position:absolute;right:0;border-right:1px solid var(--bd)}.bk>.bn:first-child::before{top:50%;bottom:0}.bk>.bn:last-child::before{top:0;bottom:50%}
.bk+.bm{margin-left:14px}.bk+.bm::before{content:'';position:absolute;left:-14px;top:50%;width:14px;border-top:1px solid var(--bd)}

<body>
<header>
  <h1>PDG 2 – Tabelloni rapidi</h1>
  <div class="sub">Funziona sempre in locale: i dati restano solo su questo dispositivo/browser (nessun collegamento a Gare o Firebase). Stesse griglie e recuperi di pdg.</div>
  <div class="new">
    <label class="cn1">Categoria (testo libero)<input id="nNome" placeholder="es. B -20, Cadetti -55 BMN, ragazzi 30kg…"></label>
    <label>N. atleti<input id="nN" type="number" min="2" max="64" value="8"></label>
    <label>Tipo di gara<select id="nTipo"></select></label>
    <label>Numerazione<select id="nNz"><option value="c">A cascata (1 contro ultimo)</option><option value="s">In sequenza (1-2, 3-4…)</option></select></label>
    <button class="p" onclick="creaCat()">Crea tabellone</button>
    <button onclick="apriCestino()">🗑 Cestino (<span id="tcount">0</span>)</button>
    <button onclick="esporta()">Esporta</button>
    <button onclick="document.getElementById('imp').click()">Importa</button>
    <input id="imp" type="file" accept=".json" style="display:none" onchange="importa(this)">
  </div>
</header>
<main id="app"></main>
<div id="zb"><button onclick="zoom(-0.1)" title="Rimpicciolisci la griglia">−</button><span id="zv">100%</span><button onclick="zoom(0.1)" title="Ingrandisci la griglia">+</button><button onclick="zoom(0)" title="Zoom 100%" style="font-size:12px">1:1</button></div>

<dialog id="dlg">
  <h3 style="margin-top:0">Cestino</h3>
  <div id="trashList"></div>
  <div style="display:flex;gap:8px;justify-content:space-between;margin-top:12px">
    <button class="danger" onclick="svuotaCestino()">Svuota cestino</button>
    <button onclick="document.getElementById('dlg').close()">Chiudi</button>
  </div>
</dialog>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const TIPI={ijf:'IJF',ed:'Eliminazione diretta',g:"Girone all'italiana",dr:'Doppio recupero'};

/* ================= LOGICA COPIATA DA pdg.html ================= */
const sp=S=>{let p=[0];while(p.length<S){const n=p.length*2;p=p.flatMap(x=>[x,n-1-x])}return p};
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
// vincitore valido solo se l'atleta salvato e' ancora uno dei due dell'incontro
const sd=(c,id,a,b)=>{const r=(c.res||{})[id];if(!r||r.wi==null)return null;return r.wi===a?0:r.wi===b?1:null};

// sorteggio IJF / eliminazione diretta (senza teste di serie)
function draw(c){const n=c.atleti.length,S=Math.max(8,2**Math.ceil(Math.log2(n))),Q=S/4,rk=c.rk||[],
 sh=shuf,
 seeds=c.atleti.map((_,i)=>i).filter(i=>rk[i]!=null).sort((a,b)=>rk[a]-rk[b]).slice(0,8),sl=Array(S).fill(undefined),
 heads=[0,3,...sh([1,2])],ord=sh([0,1,2,3]);let need=S-n;
 const bye=k=>{if(need>0&&sl[k]===undefined){sl[k]=-1;need--}};
 seeds.slice(0,4).forEach((a,k)=>sl[heads[k]*Q]=a);
 const s2=Q>=4?seeds.slice(4):[];s2.forEach((a,k)=>sl[ord[k]*Q+Q/2]=a);
 seeds.slice(0,4).forEach((a,k)=>bye(heads[k]*Q+1));s2.forEach((a,k)=>bye(ord[k]*Q+Q/2+1));
 sh([...Array(S/2).keys()]).forEach(k=>{if(need>0&&sl[2*k]===undefined&&sl[2*k+1]===undefined){sl[2*k+1]=-1;need--}});
 const used=new Set([...seeds.slice(0,4),...s2]),rest=sh(c.atleti.map((_,i)=>i).filter(i=>!used.has(i)));
 for(let k=0;k<S;k++)if(sl[k]===undefined)sl[k]=rest.length?rest.shift():-1;
 c.slots=sl;c.seeds=[...seeds.slice(0,4),...s2]}

// girone all'italiana (2-5 atleti, tutti contro tutti). Pari: vittorie, punti fatti, scontro diretto (tra i pari)
function rr(n){const a=[...Array(n).keys()],out=[];if(n%2)a.push(-1);const m=a.length;
 for(let r=0;r<m-1;r++){for(let i=0;i<m/2;i++){const x=a[i],y=a[m-1-i];if(x>=0&&y>=0)out.push(r%2&&i==0?[y,x]:[x,y])}a.splice(1,0,a.pop())}return out}
function gir(c){const P=[],pr=c.pairs||[];for(let k=0;k<pr.length;k+=2)P.push([pr[k],pr[k+1]]);
 const st=c.atleti.map((_,i)=>({i,v:0,pt:0,h:{}}));
 const all=P.map(([a,b],k)=>{const id='g'+k,r=(c.res||{})[id]||{},w0=sd(c,id,a,b);
  if(w0!=null){const w=w0==0?a:b,l=w0==0?b:a;st[w].v++;st[w].h[l]=1;st[a].pt+=parseInt(r.pa)||0;st[b].pt+=parseInt(r.pb)||0}
  return{id,lab:'Incontro '+(k+1),a,b,w:w0==null?null:(w0==0?a:b),l:w0==null?null:(w0==0?b:a)}});
 const o=[...st].sort((x,y)=>y.v-x.v||y.pt-x.pt),out=[];
 for(let i=0;i<o.length;){let j=i+1;while(j<o.length&&o[j].v==o[i].v&&o[j].pt==o[i].pt)j++;
  const G=o.slice(i,j),ids=G.map(g=>g.i);G.forEach(g=>g.hw=ids.filter(d=>g.h[d]).length);G.sort((x,y)=>y.hw-x.hw);out.push(...G);i=j}
 return{all,ms:all,rk:out.map((g,k)=>[(k+1)+'°',g.i,[g.v,g.pt]])}}

// scontro diretto con doppio recupero: 2 pool (A dispari, B pari), numeri a cascata (bit-reversal), recuperi dai 4 semifinalisti
function drd(c,rand,seq){const n=c.atleti.length,K=Math.max(4,2**Math.ceil(Math.log2(Math.ceil(n/2)))),L=Math.log2(K),rk=c.rk||[],
 sh=a=>rand?shuf(a):[...a],
 ix=c.atleti.map((_,i)=>i),sd0=ix.filter(i=>rk[i]!=null).sort((a,b)=>rk[a]-rk[b]),ord=[...sd0,...sh(ix.filter(i=>rk[i]==null))],
 br=i=>{let r=0;for(let b=0;b<L;b++)r=r<<1|(i>>b&1);return r};let sl=[];const pnum=[];
 c.num=[];ord.forEach((a,k)=>c.num[a]=k+1);
 for(let P=0;P<2;P++)for(let i=0;i<K;i++){const num=2*(br(i)+1)-(P==0?1:0);pnum.push(num);sl.push(num<=n?ord[num-1]:-1)}
 if(seq){let k=0;sl=sl.map((v,pos)=>{if(pnum[pos]>n)return -1;const a=ord[k++];c.num[a]=pnum[pos];return a})}
 c.slots=sl;c.seeds=sd0.slice(0,8)}
function brk(c){if(!c.slots||c.slots.length<8)return{ms:[],rk:[],all:[]};const wd=new Set(),K=c.slots.length/2,L=Math.log2(K),D={},O=[],H=[[[],[]],[[],[]]],sem=[],
 NM=['Semifinale','Quarti','Ottavi','Sedicesimi'],def=(id,lab,a,b)=>{D[id]={id,lab,a,b};O.push(id)};
 const ev=id=>[D[id].a(),D[id].b()];
 const win=id=>{const[a,b]=ev(id);if(a==-1)return b;if(b==-1)return a;if(a==null||b==null)return null;const w=sd(c,id,a,b);return w==null?null:w==0?a:b};
 const los=id=>{const[a,b]=ev(id);if(a==-1||b==-1)return-1;if(a==null||b==null)return null;const w=sd(c,id,a,b);return w==null?null:w==0?b:a};
 const fin=[];
 for(let P=0;P<2;P++){const pn='Pool '+'AB'[P],hw=[];
  for(let h=0;h<2;h++){let it=c.slots.slice(P*K+h*K/2,P*K+(h+1)*K/2).map(x=>()=>x),r=1;
   while(it.length>1){const nx=[],ids=[];for(let i=0;i<it.length;i+=2){const id='ab'[P]+h+r+(i/2),x=it[i],y=it[i+1];def(id,pn+', '+NM[L-r],x,y);ids.push(id);nx.push(()=>win(id))}H[P][h][r]=ids;it=nx;r++}
   hw.push(it[0])}
  const id='ab'[P]+'F';def(id,pn+', '+NM[0],hw[0],hw[1]);fin.push(id);sem[P]=hw}
 const S=[sem[0][0],sem[1][0],sem[0][1],sem[1][1]],PH=[[0,0],[1,0],[0,1],[1,1]];
 const vic=(k,d)=>{const r=L-d;if(r<1||r>L-1)return-1;const s=S[k]();if(s==null)return null;
  for(const id of H[PH[k][0]][PH[k][1]][r]){const[a,b]=ev(id);if(a>=0&&b>=0&&win(id)==s)return s==a?b:a}return-1};
 const q=[[1,5],[3,7],[2,6],[4,8]];
 q.forEach(([lo,hi])=>def('p1'+lo,'Recupero, turno 1',()=>vic(lo-1,3),()=>vic(hi-5,2)));
 q.forEach(([lo,hi])=>def('p2'+lo,'Recupero, turno 2',()=>win('p1'+lo),()=>vic(hi-5,1)));
 def('p31','Recupero, turno 3',()=>win('p21'),()=>win('p23'));def('p32','Recupero, turno 3',()=>win('p22'),()=>win('p24'));
 def('p41','3° posto (griglia 1)',()=>win('p31'),()=>los(fin[1]));def('p42','3° posto (griglia 2)',()=>win('p32'),()=>los(fin[0]));
 def('f','Finale',()=>win(fin[0]),()=>win(fin[1]));
 return{all:O.map(id=>{const[a,b]=ev(id);return{id,lab:D[id].lab,a,b,w:win(id),l:los(id)}}),ms:O.map(id=>{const[a,b]=ev(id);return{id,lab:D[id].lab,a:D[id].a(),b:D[id].b(),ok:a!=null&&b!=null&&a>=0&&b>=0}}).filter(m=>m.ok&&m.a!=null&&m.b!=null&&m.a>=0&&m.b>=0),
  rk:(()=>{const r=[['1°',win('f')],['2°',los('f')],['3°',win('p41')],['3°',win('p42')],['5°',los('p41')],['5°',los('p42')],['7°',los('p31')],['7°',los('p32')],...['p21','p22','p23','p24'].map(id=>['9°',los(id)]),...['p11','p12','p13','p14'].map(id=>['13°',los(id)])].filter(x=>x[1]!=null&&x[1]>=0);
  if(win('f')!=null){const u=new Set(r.map(x=>x[1])),left=c.atleti.map((_,i)=>i).filter(i=>!u.has(i)&&!wd.has(i)),p=r.length+1;left.forEach(i=>r.push([p+'°',i]))}return r})()}}

// secondo incontro garantito: a gara finita chi ha fatto un solo incontro ne gioca un altro contro uno nella stessa situazione (non fa classifica)
function ex(c,b){const wd=new Set(),dn=m=>{const x=b.all.find(z=>z.id==m.id);return x&&x.w!=null&&x.w>=0};
 if(!b.ms.length||!b.ms.every(dn)||(c.fmt!='g'&&!(b.rk[0]&&b.rk[0][0]=='1°')))return b;
 // posizione nel tabellone (quarti/pool contigui): chi e' vicino viene accoppiato per primo, come nei ripescaggi
 const n0=c.atleti.length,S0=Math.max(8,2**Math.ceil(Math.log2(n0))),sl0=c.fmt=='dr'?c.slots:(c.slots&&c.slots.length==S0?c.slots:sp(S0).map(x=>x<n0?x:-1)),pos=i=>c.fmt=='g'?i:sl0.indexOf(i);
 const cnt={},opp={};b.ms.forEach(m=>{[m.a,m.b].forEach((x,k)=>{cnt[x]=(cnt[x]||0)+1;(opp[x]=opp[x]||new Set()).add(k?m.a:m.b)})});
 const el=Object.keys(cnt).map(Number).filter(a=>cnt[a]==1&&!wd.has(a)).sort((x,y)=>pos(x)-pos(y)),used=new Set(),out=[];
 // se i due si sono gia' incontrati (es. girone a 2) il secondo incontro e' a nomi invertiti
 const add=(a,o)=>{const m0=b.ms.find(m=>(m.a==a&&m.b==o)||(m.a==o&&m.b==a));if(m0&&m0.a==a)[a,o]=[o,a];
  const id='x'+a+'_'+o,w0=sd(c,id,a,o);
  out.push({id,lab:'Secondo incontro (non fa classifica)',a,b:o,w:w0==null?null:(w0==0?a:o),l:w0==null?null:(w0==0?o:a)})};
 el.forEach(a=>{if(used.has(a))return;const o=el.find(z=>z!=a&&!used.has(z)&&!opp[a].has(z))??el.find(z=>z!=a&&!used.has(z));
  if(o==null)return;used.add(a);used.add(o);add(a,o)});
 // numero dispari: l'ultimo senza avversario gioca contro chi ha fatto meno incontri (meglio uno che non ha gia' affrontato)
 const lone=el.find(a=>!used.has(a));
 if(lone!=null){const cd=Object.keys(cnt).map(Number).filter(z=>z!=lone&&!wd.has(z)).sort((x,y)=>(opp[lone].has(x)-opp[lone].has(y))||cnt[x]-cnt[y]||Math.abs(pos(x)-pos(lone))-Math.abs(pos(y)-pos(lone))||x-y);if(cd.length)add(lone,cd[0])}
 return{...b,ms:[...b.ms,...out],all:[...b.all,...out],ex:out,note:''}}

// classifica sempre completa: ordinata per posto, poi chi e' ancora in gara ('—')
function fullRk(c,b){const rk=[...b.rk].sort((x,y)=>(parseInt(x[0])||999)-(parseInt(y[0])||999)),u=new Set(rk.map(x=>x[1]));c.atleti.forEach((_,i)=>{if(!u.has(i))rk.push(['—',i])});return{...b,rk}}
function bk(c){let b=bk0(c);if(c.sx)b=ex(c,b);if(c.fmt!='g')b=fullRk(c,b);const A={};b.all.forEach(x=>A[x.id]=x);b.ms=b.ms.map(m=>{const x=A[m.id];return x?{...m,w:x.w,l:x.l}:m});return b}
function bk0(c){if(c.fmt=='g')return gir(c);if(c.fmt=='dr')return brk(c);const ED=c.fmt=='ed',n=c.atleti.length,S=Math.max(8,2**Math.ceil(Math.log2(n))),Q=S/4,sl=c.slots&&c.slots.length==S?c.slots:sp(S).map(x=>x<n?x:-1),D={},O=[],QM=[],QW=[],RM={};
 const def=(id,lab,a,b)=>{D[id]={id,lab,a,b};O.push(id)},ab=id=>[D[id].a(),D[id].b()];
 const win=id=>{const[a,b]=ab(id);if(a==-1)return b;if(b==-1)return a;if(a==null||b==null)return null;const w=sd(c,id,a,b);return w==null?null:w==0?a:b};
 const los=id=>{const[a,b]=ab(id);if(a==-1||b==-1)return-1;if(a==null||b==null)return null;const w=sd(c,id,a,b);return w==null?null:w==0?b:a};
 for(let q=0;q<4;q++){let it=sl.slice(q*Q,q*Q+Q).map(x=>()=>x),r=1,ids=[];
  while(it.length>1){const nx=[];for(let i=0;i<it.length;i+=2){const id='t'+q+r+(i/2),x=it[i],y=it[i+1];def(id,'Tabellone '+(q+1)+', turno '+r,x,y);ids.push(id);RM[id]=r;nx.push(()=>win(id))}it=nx;r++}
  QM.push(ids);QW.push(it[0])}
 const pl=q=>()=>los(QM[q][QM[q].length-1]);
 if(!ED){def('rs1','Recupero A-B',pl(0),pl(1));def('rs2','Recupero C-D',pl(2),pl(3));}
 def('sf1','Semifinale 1',QW[0],QW[1]);def('sf2','Semifinale 2',QW[2],QW[3]);
 if(!ED){def('b1','Per il 3° posto (1)',()=>los('sf1'),()=>win('rs2'));def('b2','Per il 3° posto (2)',()=>los('sf2'),()=>win('rs1'))}
 def('f','Finale',()=>win('sf1'),()=>win('sf2'));
 return{all:O.map(id=>{const[a,b]=ab(id);return{id,lab:D[id].lab,a,b,w:win(id),l:los(id)}}),ms:O.map(id=>{const[a,b]=ab(id);return{id,lab:D[id].lab,a,b}}).filter(m=>m.a!=null&&m.b!=null&&m.a>=0&&m.b>=0),
  rk:(()=>{const lr=Math.log2(Q),r=ED?[['1°',win('f')],['2°',los('f')],['3°',los('sf1')],['3°',los('sf2')]]:[['1°',win('f')],['2°',los('f')],['3°',win('b1')],['3°',win('b2')],['5°',los('b1')],['5°',los('b2')],['7°',los('rs1')],['7°',los('rs2')]];
   Object.keys(RM).forEach(id=>{const rr=RM[id];if(ED||rr<lr)r.push([(4*2**(lr-rr)+1)+'°',los(id)])});return r.filter(x=>x[1]!=null&&x[1]>=0)})()}}

/* ================= DATI ================= */
const KEY='pdg2.dati';
let ST={cats:[],trash:[]};
try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r&&Array.isArray(r.cats)){ST=r;if(!Array.isArray(ST.trash))ST.trash=[]}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}}
const getCat=id=>ST.cats.find(c=>c.id===id);
const nm=(c,i)=>c.atleti[i]||'Atleta '+(i+1);
const nres=c=>Object.values(c.res||{}).filter(r=>r.wi!=null).length;
// numerazione: 'c' = a cascata (1 contro l'ultimo, come pdg), 's' = in sequenza (Atleta 1-2, 3-4… dall'alto in basso)
function seqSlots(c){const n=c.atleti.length,S=Math.max(8,2**Math.ceil(Math.log2(n)));let k=0;c.slots=sp(S).map(x=>x<n?k++:-1)}
function prep(c){delete c.slots;delete c.num;delete c.seeds;delete c.pairs;c.rk=[];
 if(c.fmt=='g')c.pairs=rr(c.atleti.length).flat();else if(c.fmt=='dr')drd(c,false,c.nz=='s');else if(c.nz=='s')seqSlots(c)}
function newCat(nome,n,fmt,nz){const c={id:uid(),nome,fmt,nz:nz||'c',open:true,sx:true,atleti:Array(n).fill(''),res:{}};prep(c);return c}
// migrazione dalla prima versione della pagina
(function(){const M={doppio:'dr',diretta:'ed',girone:'g'};[...ST.cats,...ST.trash].forEach(c=>{
 if(c.ath||!c.atleti){const n=c.n||(c.atleti&&c.atleti.length)||8;c.atleti=Array.from({length:n},(_,i)=>((c.ath&&c.ath[i])||{}).nm||'');delete c.ath;delete c.n;c.res={}}
 if(M[c.tipo]){c.fmt=M[c.tipo];delete c.tipo}else if(c.tipo){c.fmt=c.fmt||c.tipo;delete c.tipo}
 if(!TIPI[c.fmt])c.fmt='ijf';if(c.sx==null)c.sx=true;if(!c.res)c.res={};
 if(!c.slots&&!c.pairs)prep(c)});save()})();

/* ================= RENDER ================= */
function side(c,m,k,tag,pn){
 const x=k?m.b:m.a,both=m.a!=null&&m.b!=null&&m.a>=0&&m.b>=0,e=x==null||x<0,
  cl=e?'e':(m.w==null||!both)?'':m.w===x?'w':'l',r=(c.res||{})[m.id]||{};
 let h=`<div class="bl ${cl}"><i>${esc(tag||(e?'':pn(x)))}</i>`;
 if(e)h+=`<span>${x==null?'…':'bye'}</span>`;
 else h+=`<input class="nm" value="${esc(nm(c,x))}" onchange="setName('${c.id}',${x},this.value)">`+(both?`<button class="w2" title="Segna vincitore (ri-clic per annullare)" onclick="setWin('${c.id}','${m.id}',${k})">${m.w===x?'★':'☆'}</button>`:'');
 h+='</div>';
 if(!e){
  if(c.fmt=='g')h+=`<input class="ptn" type="number" placeholder="Punti fatti" value="${esc(r[k?'pb':'pa'])}" onchange="setPt('${c.id}','${m.id}',${k},this.value)">`;
  h+=`<input class="inf" placeholder="Tempo, punti, score, shido…" value="${esc(r['i'+k])}" onchange="setInfo('${c.id}','${m.id}',${k},this.value)">`;
 }
 return h}
function cardHtml(c,m,pn,cap,t){return`<div class="bm">${cap?`<small>${esc(cap)}</small>`:''}${side(c,m,0,t&&t[0],pn)}${side(c,m,1,t&&t[1],pn)}</div>`}

// griglia ad albero, come pdg.html
function GR(c,b,part){
 const A={},n=c.atleti.length;b.all.forEach(x=>A[x.id]=x);
 const S0=Math.max(8,2**Math.ceil(Math.log2(n))),sl=c.fmt=='dr'?null:(c.slots&&c.slots.length==S0?c.slots:sp(S0).map(x=>x<n?x:-1)),
  pn=i=>c.fmt=='dr'?c.num[i]:sl.indexOf(i)+1,
  CAP={f:'Finale',aF:'Finale Pool A',bF:'Finale Pool B',sf1:'Semifinale 1',sf2:'Semifinale 2',p41:'3° posto',p42:'3° posto',b1:'3° posto',b2:'3° posto',rs1:'Recupero A-B',rs2:'Recupero C-D'},
  lineRO=(x,tag)=>{const e=x==null||x<0;return`<div class="bl ${e?'e':''}"><i>${esc(tag||(e?'':pn(x)))}</i><span>${x==null?'…':x<0?'bye':esc(nm(c,x))}</span></div>`},
  box=nd=>{const m=A[nd.id]||{id:nd.id},t=nd.tags||[];return cardHtml(c,m,pn,CAP[nd.id],t)},
  node=(nd,pm,ix)=>{if(nd.lf)return`<div class="bn"><div class="bm lf">${lineRO(ix?pm.b:pm.a,nd.lf)}</div></div>`;
   const k=nd.k||[],m=A[nd.id]||{};return`<div class="bn"><div class="bt">${k.length?`<div class="bk">${k.map((x,i)=>node(x,m,i)).join('')}</div>`:''}${box(nd)}</div></div>`};
 let main,rec=[],leg='';
 if(c.fmt=='dr'){const K=c.slots.length/2,L=Math.log2(K),hf=(P,h,r,i)=>({id:'ab'[P]+h+r+i,k:r>1?[hf(P,h,r-1,2*i),hf(P,h,r-1,2*i+1)]:[]}),pool=P=>({id:'ab'[P]+'F',k:[hf(P,0,L-1,0),hf(P,1,L-1,0)]}),
   r1=(lo,hi)=>({id:'p1'+lo,tags:['R'+lo,'R'+hi]}),r2=(lo,hi)=>({id:'p2'+lo,k:[r1(lo,hi),{lf:'R'+(hi+4)}]}),
   p31={id:'p31',k:[r2(1,5),r2(3,7)]},p32={id:'p32',k:[r2(2,6),r2(4,8)]};
  main={id:'f',k:[pool(0),pool(1)]};rec=[{id:'p41',k:[p31,{lf:'Perd. SF'}]},{id:'p42',k:[p32,{lf:'Perd. SF'}]}];
  leg='Numeri = numero di sorteggio (a cascata). R1–R8 = ripescati dai semifinalisti, R9–R12 = ripescati dai quarti. Perd. SF = perdente di semifinale.'}
 else{const lr=Math.log2(S0/4),th=(q,r,i)=>({id:'t'+q+r+i,k:r>1?[th(q,r-1,2*i),th(q,r-1,2*i+1)]:[]});
  main={id:'f',k:[{id:'sf1',k:[th(0,lr,0),th(1,lr,0)]},{id:'sf2',k:[th(2,lr,0),th(3,lr,0)]}]};
  if(c.fmt!='ed'){rec=[{id:'b1',k:[{lf:'Perd. SF1'},{id:'rs2',tags:['Perd. C','Perd. D']}]},{id:'b2',k:[{lf:'Perd. SF2'},{id:'rs1',tags:['Perd. A','Perd. B']}]}];
   leg='Numeri = posizione nel tabellone. Perd. = perdente del pool o della semifinale.'}else leg='Numeri = posizione nel tabellone.'}
 const gm=`<div class="gw" data-k="${c.id}m"><div class="gt">${node(main)}</div></div>`,gr=rec.length?`<div class="gw" data-k="${c.id}r">${rec.map(r=>`<div class="gt">${node(r)}</div>`).join('')}</div>`:'';
 return (part=='rec'?gr:gm)+`<p class="mu">${leg}</p>`}

function podHtml(c,b){
 const rk=b.rk,lab={1:'🥇 1° posto',2:'🥈 2° posto',3:'🥉 3° posto'};let sl;
 if(c.fmt=='g'){const done=b.ms.length&&b.ms.every(m=>m.w!=null);sl=[1,2,3].slice(0,Math.min(3,c.atleti.length)).map((p,i)=>({p,i:done?rk[i][1]:null}))}
 else{const g=l=>rk.filter(x=>x[0]==l&&x[1]!=null&&x[1]>=0);
  sl=[{p:1,i:g('1°')[0]?g('1°')[0][1]:null},{p:2,i:g('2°')[0]?g('2°')[0][1]:null},{p:3,i:g('3°')[0]?g('3°')[0][1]:null},{p:3,i:g('3°')[1]?g('3°')[1][1]:null}]}
 return'<div class="pod">'+sl.map(s=>`<div><b>${lab[s.p]}</b><span>${s.i!=null?esc(nm(c,s.i)):'—'}</span></div>`).join('')+'</div>'}
function rkHtml(c,b){
 if(c.fmt=='g')return'<table><tr><th>#</th><th>Atleta</th><th>Vittorie</th><th>Punti</th></tr>'+b.rk.map(x=>`<tr><td>${x[0]}</td><td>${esc(nm(c,x[1]))}</td><td>${x[2][0]}</td><td>${x[2][1]}</td></tr>`).join('')+'</table>';
 return'<table><tr><th>Posto</th><th>Atleta</th></tr>'+b.rk.map(x=>`<tr><td>${x[0]}</td><td>${esc(nm(c,x[1]))}</td></tr>`).join('')+'</table>'}

function catHtml(c){
 const b=bk(c),n=c.atleti.length,done=b.ms.filter(m=>m.w!=null).length;
 let h=`<details class="cat" ${c.open?'open':''} ontoggle="tg('${c.id}',this.open)">`;
 h+=`<summary><span class="cnm">${esc(c.nome||'(senza nome)')}</span><span class="tag">${n} atleti · ${TIPI[c.fmt]}</span><span class="pr">${done}/${b.ms.length}</span><button class="x" title="Sposta nel cestino" onclick="event.preventDefault();event.stopPropagation();delCat('${c.id}')">🗑</button></summary><div class="body">`;
 // impostazioni raccolte in un riquadro chiuso
 h+=`<details class="opt" ${c.opt?'open':''} ontoggle="tgo('${c.id}',this.open)"><summary>⚙ Impostazioni categoria</summary><div class="tools"><label class="cname">Categoria<input value="${esc(c.nome)}" onchange="setCat('${c.id}','nome',this.value)"></label>`;
 h+=`<label>Atleti<input type="number" min="2" max="${c.fmt=='g'?5:64}" value="${n}" onchange="setN('${c.id}',this.value)"></label>`;
 h+=`<label>Tipo<select onchange="setFmt('${c.id}',this.value)">${Object.keys(TIPI).map(k=>`<option value="${k}"${k===c.fmt?' selected':''}>${TIPI[k]}</option>`).join('')}</select></label>`;
 h+=`<label class="chk"><input type="checkbox" ${c.sx?'checked':''} onchange="setSx('${c.id}',this.checked)">Secondo incontro garantito</label>`;
 if(c.fmt!='g')h+=`<label>Numerazione<select onchange="setNz('${c.id}',this.value)"><option value="c"${c.nz!='s'?' selected':''}>A cascata (1 contro ultimo)</option><option value="s"${c.nz=='s'?' selected':''}>In sequenza (1-2, 3-4…)</option></select></label><button onclick="sorteggia('${c.id}')">Sorteggia</button><button onclick="riordina('${c.id}')">Rimetti in ordine</button>`;
 h+=`<button class="d" onclick="azzera('${c.id}')">Azzera incontri</button></div></details>`;
 // 4 pulsanti affiancati: si possono aprire anche tutti, in ordine di apertura
 const sec=Array.isArray(c.sec)?c.sec:['g'],hasRec=c.fmt=='ijf'||c.fmt=='dr';
 const NAME={g:'Griglia',r:'Griglia recuperi',x:'2° incontro garantito',p:'Premiazioni'};
 h+='<div class="tabs">'+['g','r','x','p'].map(k=>{const dis=k=='r'&&!hasRec,on=sec.includes(k)&&!dis;
  return `<button class="${on?'on':''}" ${dis?'disabled title="Non previsti in questo formato"':''} onclick="setSec('${c.id}','${k}')">${NAME[k]}</button>`}).join('')+'</div>';
 let any=false;
 sec.forEach(k=>{
  if(k=='g'){any=true;
   if(c.fmt=='g')h+='<h4>Incontri</h4><div class="wrap">'+b.all.map(m=>cardHtml(c,m,i=>i+1,m.lab)).join('')+'</div>';
   else h+='<h4>Griglia</h4>'+GR(c,b,'main');
  }else if(k=='r'&&hasRec){any=true;h+='<h4>Griglia recuperi</h4>'+GR(c,b,'rec')}
  else if(k=='x'){any=true;h+='<h4>2° incontro garantito (non fa classifica)</h4>';
   const x=b.ex||[];
   if(!c.sx)h+='<div class="muted">Opzione disattivata: attivala da ⚙ Impostazioni categoria.</div>';
   else if(x.length)h+='<div class="wrap">'+x.map(m=>cardHtml(c,m,i=>i+1,m.lab)).join('')+'</div>'+(b.note?`<div class="muted">${esc(b.note)}</div>`:'');
   else if(b.note)h+=`<div class="muted">${esc(b.note)}</div>`;
   else h+='<div class="muted">Si forma a gara finita: chi ha fatto un solo incontro ne gioca un altro contro uno nella stessa situazione.</div>';
  }else if(k=='p'){any=true;h+='<h4>Premiazioni</h4>'+podHtml(c,b);
   if(c.pc)h+='<h4>Classifica completa</h4>'+rkHtml(c,b)+`<button onclick="setPc('${c.id}')">Nascondi classifica</button>`;
   else h+=`<div style="margin-top:10px"><button class="p" onclick="setPc('${c.id}')">Continua ▾</button></div>`}
 });
 if(!any)h+='<div class="muted" style="margin-top:12px">Tocca un pulsante per aprire la sezione.</div>';
 return h+'</div></details>'}

function render(){
 const sy=window.scrollY,sx=window.scrollX;
 $('app').innerHTML=ST.cats.length?ST.cats.map(catHtml).join(''):'<p class="empty">Nessuna categoria. Scrivi un nome (anche solo un appunto), il numero di atleti e il tipo di gara, poi “Crea tabellone”.</p>';
 window.scrollTo(sx,sy);
 $('tcount').textContent=ST.trash.length;

/* ================= AZIONI ================= */
$('nTipo').innerHTML=Object.keys(TIPI).map(k=>`<option value="${k}">${TIPI[k]}</option>`).join('');
function creaCat(){
 let n=parseInt($('nN').value)||0,fmt=$('nTipo').value;
 if(n<2){alert('Inserisci il numero di atleti (almeno 2).');return}
 n=Math.min(64,n);
 if(fmt=='g'&&n>5){alert('Il girone all’italiana è previsto da 2 a 5 atleti (come in pdg). Scegli IJF, Doppio recupero o Eliminazione diretta.');return}
 if(fmt!='g'&&n<4){if(!confirm('Con meno di 4 atleti non c’è sorteggio: creo un girone all’italiana?'))return;fmt='g'}
 ST.cats.unshift(newCat($('nNome').value.trim(),n,fmt,$('nNz').value));
 $('nNome').value='';save();render();
}
function setPc(id){const c=getCat(id);c.pc=!c.pc;save();render()}
function tgo(id,o){const c=getCat(id);if(c&&!!c.opt!==o){c.opt=o;save()}}
function setSec(id,k){const c=getCat(id);let a=Array.isArray(c.sec)?[...c.sec]:['g'];a=a.includes(k)?a.filter(x=>x!==k):[...a,k];c.sec=a;save();render()}
function tg(id,open){const c=getCat(id);if(c&&c.open!==open){c.open=open;save()}}
function setName(id,i,v){const c=getCat(id);c.atleti[i]=v.trim();save();render()}
function setInfo(id,mid,k,v){const c=getCat(id);(c.res[mid]=c.res[mid]||{})['i'+k]=v;save()}
function setPt(id,mid,k,v){const c=getCat(id);(c.res[mid]=c.res[mid]||{})[k?'pb':'pa']=v;save();render()}
function clean(c){for(let g=0;g<40;g++){const b=bk(c);let ch=false;
 Object.keys(c.res).forEach(id=>{const r=c.res[id];if(r.wi==null)return;const x=b.all.find(z=>z.id===id);
  if(!x||x.a==null||x.b==null||(r.wi!==x.a&&r.wi!==x.b)){delete r.wi;delete r.w;ch=true}});
 if(!ch)break}}
function setWin(id,mid,k){
 const c=getCat(id),b=bk(c),x=b.all.find(z=>z.id===mid);if(!x)return;
 const at=k?x.b:x.a;if(at==null||at<0)return;
 const r=(c.res[mid]=c.res[mid]||{});
 if(r.wi===at){delete r.wi;delete r.w}else{r.wi=at;r.w=k}
 clean(c);save();render();
}
function okReset(c){return !nres(c)||confirm('Questa modifica azzera i vincitori già segnati (i nomi restano). Continuare?')}
function setCat(id,f,v){const c=getCat(id);c[f]=v.trim();save();render()}
function setN(id,v){
 const c=getCat(id);let n=Math.max(2,Math.min(64,parseInt(v)||c.atleti.length));
 if(c.fmt=='g'&&n>5){alert('Il girone è previsto da 2 a 5 atleti.');render();return}
 if(n===c.atleti.length){render();return}
 if(!okReset(c)){render();return}
 c.atleti=Array.from({length:n},(_,i)=>c.atleti[i]||'');c.res={};prep(c);save();render();
}
function setFmt(id,f){
 const c=getCat(id);
 if(f=='g'&&c.atleti.length>5){alert('Il girone è previsto da 2 a 5 atleti: riduci il numero di atleti.');render();return}
 if(!okReset(c)){render();return}
 c.fmt=f;c.res={};prep(c);save();render();
}
function setNz(id,v){const c=getCat(id);if(!okReset(c)){render();return}c.nz=v;c.res={};prep(c);save();render()}
function setSx(id,on){const c=getCat(id);c.sx=on;clean(c);save();render()}
function sorteggia(id){
 const c=getCat(id);if(!okReset(c)){return}
 c.res={};c.rk=[];if(c.fmt=='dr')drd(c,true);else draw(c);save();render();
}
function riordina(id){const c=getCat(id);if(!okReset(c))return;c.res={};prep(c);save();render()}
function azzera(id){
 if(!confirm('Azzerare tutti i vincitori e le note degli incontri di questa categoria? I nomi degli atleti restano.'))return;
 getCat(id).res={};save();render();
}
function delCat(id){
 const i=ST.cats.findIndex(c=>c.id===id);if(i<0)return;
 const c=ST.cats.splice(i,1)[0];c.delAt=Date.now();
 ST.trash.unshift(c);save();render();renderTrash();
}
function renderTrash(){
 $('trashList').innerHTML=ST.trash.length?ST.trash.map(c=>`<div class="ti"><div class="t"><b>${esc(c.nome||'(senza nome)')}</b><div class="sub">${c.atleti.length} atleti · ${TIPI[c.fmt]} · eliminata ${new Date(c.delAt).toLocaleString('it-IT')}</div></div><button class="p" onclick="ripristina('${c.id}')">Ripristina</button><button class="danger" onclick="eliminaDef('${c.id}')">Elimina</button></div>`).join(''):'<div class="muted">Il cestino è vuoto.</div>';
}
function apriCestino(){renderTrash();$('dlg').showModal()}
function ripristina(id){
 const i=ST.trash.findIndex(c=>c.id===id);if(i<0)return;
 const c=ST.trash.splice(i,1)[0];delete c.delAt;ST.cats.unshift(c);
 save();render();renderTrash();
}
function eliminaDef(id){
 if(!confirm('Eliminare definitivamente questa categoria? Non si può recuperare.'))return;
 ST.trash=ST.trash.filter(c=>c.id!==id);save();render();renderTrash();
}
function svuotaCestino(){
 if(!ST.trash.length)return;
 if(!confirm('Svuotare il cestino? Le categorie saranno perse definitivamente.'))return;
 ST.trash=[];save();render();renderTrash();
}
function esporta(){
 const d=new Date().toISOString().slice(0,10),a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([JSON.stringify(ST)],{type:'application/json'}));
 a.download='pdg2_'+d+'.json';a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function importa(inp){
 const f=inp.files[0];if(!f)return;
 const rd=new FileReader();
 rd.onload=()=>{
  try{
   const r=JSON.parse(rd.result);
   if(!r||!Array.isArray(r.cats))throw 0;
   if(!confirm('Importare sostituisce tutte le categorie e il cestino di questa pagina. Continuare?'))return;
   ST={cats:r.cats,trash:Array.isArray(r.trash)?r.trash:[]};save();render();
  }catch(e){alert('File non valido.')}
  inp.value='';
 };
 rd.readAsText(f);
}
let Z=parseFloat((function(){try{return localStorage.getItem('pdg2.zoom')}catch(e){return null}})())||1;
function applyZ(){document.documentElement.style.setProperty('--z',Z);$('zv').textContent=Math.round(Z*100)+'%'}
function zoom(d){Z=d?Math.min(2,Math.max(0.3,Math.round((Z+d)*10)/10)):1;try{localStorage.setItem('pdg2.zoom',Z)}catch(e){}applyZ()}
applyZ();
render();
