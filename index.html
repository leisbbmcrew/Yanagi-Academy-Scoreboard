<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tabellone Judo</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#15171c"><link rel="icon" href="icon-192.png">

.pc input{width:100%}.rs div{padding:7px;border-bottom:1px solid var(--bd);cursor:pointer}.sel{margin:8px 0;font-weight:700;min-height:2.4em}.pc table{width:100%;margin:8px 0}.pc td:nth-child(2){font-size:22px;font-weight:700;text-align:center}.pc>button{width:100%;margin-top:6px}
#tm{font-size:64px;font-weight:800;text-align:center;background:#000;border-radius:8px;cursor:pointer;padding:6px}#ctl button{width:100%;margin-top:6px}#ph{text-align:center;margin:8px 0;font-weight:700}#os{color:#ff3b30;font-weight:800;text-align:center;font-size:52px;letter-spacing:1px}.osr{display:flex;align-items:center;justify-content:center;gap:34px}

#o0{border-top-width:6cqh;border-bottom-width:6cqh;border-right-width:9cqh}#o1{border-top-width:6cqh;border-bottom-width:6cqh;border-left-width:9cqh}
#sc{justify-content:space-between;margin-top:-.8cm}
#sc .scg{gap:1cqh}

.pc h3{font-size:2.6cqh;padding:4cqh}

.pc>button{font-size:2.3cqh;padding:1.1cqh}
}
</style></head><body>
<div id=app></div>
<script>
const K=['ippon','wazaari','yuko','koka'],L={ippon:'IPPON',wazaari:'WAZA-ARI',yuko:'YUKO',koka:'KOKA'},RK={koka:0,yuko:1,wazaari:2,ippon:3},SN=['Bianco','Blu'];
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ft=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const EX={AUT:'AT',EST:'EE',IRL:'IE',ISR:'IL',KAZ:'KZ',KOR:'KR',MEX:'MX',POL:'PL',PRK:'KP',SRB:'RS',SVK:'SK',SWE:'SE',TJK:'TJ',TKM:'TM',TUN:'TN',TUR:'TR',UKR:'UA',USA:'US',UZB:'UZ',VEN:'VE',VIE:'VN',ARM:'AM',AZE:'AZ',ARG:'AR',ALB:'AL',LTU:'LT',LUX:'LU',MLT:'MT',PAN:'PA',PUR:'PR',QAT:'QA',EGY:'EG',ECU:'EC',DOM:'DO',IND:'IN',IRQ:'IQ',JOR:'JO',LBN:'LB',MAR:'MA',NZL:'NZ',KOS:'XK',URU:'UY',BOL:'BO',BIH:'BA',ANG:'AO',AFG:'AF',GER:'DE',NED:'NL',SUI:'CH',CRO:'HR',SLO:'SI',POR:'PT',GRE:'GR',DEN:'DK',BUL:'BG',LAT:'LV',MGL:'MN',IRI:'IR',RSA:'ZA',UAE:'AE',KSA:'SA',ALG:'DZ',BAH:'BS',BLR:'BY',CHI:'CL',INA:'ID',DEU:'DE',NLD:'NL',CHE:'CH',HRV:'HR',SVN:'SI',PRT:'PT',GRC:'GR',DNK:'DK',BGR:'BG',LVA:'LV',MNG:'MN',IRN:'IR',ZAF:'ZA',ARE:'AE',SAU:'SA',TPE:'TW'};
const flag=c=>{c=(c||'').trim().toUpperCase();if(c.length==3)c=EX[c]||c.slice(0,2);return c.length==2&&/^[A-Z]{2}$/.test(c)?String.fromCodePoint(...[...c].map(x=>127397+x.charCodeAt(0))):''};
const nz=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/['’`._-]/g,' ').split(/\s+/).filter(Boolean).join(' ');
const tt=(s,c)=>{const l=s.ph=='r'?c.reg:c.gs;return ft(s.ph=='r'&&l!=null?Math.ceil(Math.max(0,l-s.clk)-1e-9):s.clk)};
const sc=p=>[p.ippon?'Ippon':'',p.wazaari?'W'+p.wazaari:'',p.yuko?'Y'+p.yuko:'',p.koka?'K'+p.koka:''].filter(Boolean).join(' ')||'0';

if(location.hash=='#tv'){ /* ---------- PANNELLO TV ---------- */
  const A=document.getElementById('app');
  function draw(){const D=ld('jlive',null);if(!D){A.innerHTML='<div class=tv style="display:block;text-align:center;padding-top:40cqh;font-size:5cqh">In attesa del controllo…</div>';return}
    const s=D.S,p=D.pl,c=D.cfg,m=D.meta,t=tt(s,c);
    const pan=i=>{const a=p[i],hl=s.fin&&s.win===i?'#ffd000':s.os===i?'#00e060':'';let h=`<div class=tp style="background:${i?'#0a3fa0':'#f4f4f4'};color:${i?'#fff':'#111'};${hl?'box-shadow:inset 0 0 0 1.2cqh '+hl:''}"><small>${SN[i].toUpperCase()}</small>`;
      if(a)h+=`<div class=fl>${flag(a.c)||''}</div><div class=cc>${esc(a.c)}</div><div class=nm>${esc(a.s.toUpperCase())}</div><div class=fn>${esc(a.n)}</div>`;
      h+='<div class=sh data-c="s:'+i+'">';for(let j=0;j<c.ms;j++){const col=j==c.ms-1?'#d00000':'#f5c400';h+=`<i style="border-color:${col};${j<s.sh[i]?'background:'+col:''}"></i>`}return h+'</div></div>'};
    const dt=i=>{let h='';for(let j=0;j<c.ms;j++){const col=j==c.ms-1?'#d00000':'#f5c400';h+=`<i style="border-color:${col};${j<s.sh[i]?'background:'+col:''}"></i>`}return h};const od=i=>{const on=s.os===i,col=i?'#2f6fe0':'#fff',side=i?'border-left':'border-right',glow=on?`filter:drop-shadow(0 0 1.6cqh ${col})`:'';return`<div data-c="o:${i}" style="width:0;height:0;cursor:pointer;border-top:5.6cqh solid transparent;border-bottom:5.6cqh solid transparent;${side}:8.4cqh solid ${on?col:'#555'};${glow}"></div>`};const oa=s.os!==null;
    const w=s.fin?`<div style="background:#0a7d2c;padding:.8cqh 2cqw;margin-top:1cqh;font-size:4.2cqh;border-radius:1cqh">VINCE ${esc(s.win===null?'':(p[s.win]?p[s.win].s.toUpperCase()+' '+p[s.win].n:SN[s.win].toUpperCase()))}<div style="font-size:3.4cqh;font-weight:400">${esc(s.why)}</div></div>`:'';
    A.innerHTML=`<div class=tv>${pan(0)}<div class=tc><div style="font-size:4cqh;opacity:.6">${m.no?'MATCH '+esc(m.no):''} ${esc(m.cat)}</div><div style="font-size:6cqh;color:#ffd000;height:6cqh">${s.han?'HANTEI':s.ph=='g'?'GOLDEN SCORE':''}</div><div style="display:flex;align-items:center;justify-content:center;gap:1.2cqw"><div class=dc data-c="s:0">${dt(0)}</div><div class=tt data-c="tog" style="color:${s.exp||s.fin?'#ff3b30':s.ph=='g'?'#ffd000':'#fff'}">${t}</div><div class=dc data-c="s:1">${dt(1)}</div></div><div style="width:94%;margin-top:1cqh;display:flex;justify-content:space-between">${[0,1].map(i=>`<div style="display:flex;gap:1.6cqw">${K.filter(k=>c.tachi[k]).map(k=>`<div style="display:flex;flex-direction:column;align-items:center;gap:.4cqh"><span style="font-size:2.6cqh;opacity:.7;font-weight:700">${k[0].toUpperCase()}</span><b data-c="p:${i}:${k}" style="font-size:6.5cqh;min-width:8.5cqw;border-radius:1cqh;padding:0 .6cqw;display:inline-flex;align-items:center;justify-content:center;background:${i?'#0a3fa0':'#f4f4f4'};color:${i?'#fff':'#111'}">${s.p[i][k]}</b></div>`).join('')}</div>`).join('')}</div><div style="font-size:3.5cqh;opacity:.6;margin-top:1cqh">OSAE-KOMI</div><div style="display:flex;align-items:center;justify-content:center;gap:8cqw">${od(0)}<div class=ob style="${oa?'color:#ffd000;border-color:#ffd000':''}">${oa?String(Math.floor(s.ot)).padStart(2,'0'):'00'}</div>${od(1)}</div>${w}</div>${pan(1)}</div>`;
}
  A.addEventListener('pointerdown',e=>{const t=e.target.closest('[data-c]');if(t)localStorage.setItem('jcmd',JSON.stringify({t:Date.now(),c:t.dataset.c}))});addEventListener('storage',e=>{if(e.key=='jlive')draw()});draw();setInterval(draw,500);
  document.addEventListener('keydown',e=>{if(e.key=='F11'||e.key=='f')document.documentElement.requestFullscreen?.()});
  document.addEventListener('dblclick',e=>{if(!e.target.closest('[data-c]'))document.documentElement.requestFullscreen?.()});
}else{ /* ---------- CONTROLLO ---------- */
var cfg=Object.assign({reg:240,gs:null,ms:3},{tachi:{ippon:1,wazaari:1,yuko:1,koka:0},ne:{koka:5,yuko:10,wazaari:15,ippon:20}},ld('jcfg',{}));
if(cfg.tachi&&cfg.tachi.koga!==undefined&&cfg.tachi.koka===undefined)cfg.tachi.koka=cfg.tachi.koga;
if(cfg.tachi)delete cfg.tachi.koga;
if(cfg.ne&&cfg.ne.koga!==undefined&&cfg.ne.koka===undefined)cfg.ne.koka=cfg.ne.koga;
if(cfg.ne)delete cfg.ne.koga;
var db=ld('jdb',[]),rows=ld('jrows',[]),meta=ld('jmeta',{no:'1',cat:''});
const ns=()=>({ph:'r',clk:0,run:0,exp:0,han:0,rt:0,os:null,ot:0,or:0,oa:null,frz:0,orWas:0,p:[0,1].map(()=>({ippon:0,wazaari:0,yuko:0,koka:0})),sh:[0,0],fin:0,win:null,why:''});
var S=ns(),pl=[null,null],undo=[];
const pn=i=>pl[i]?((pl[i].s+' '+pl[i].n).trim()+(pl[i].c?' ('+pl[i].c+')':'')):SN[i];
const lim=()=>S.ph=='r'?cfg.reg:cfg.gs;
const push=()=>{undo.push(JSON.stringify([S,rows.length]));if(undo.length>80)undo.shift()};
function fin(w,y){if(S.fin)return;Object.assign(S,{fin:1,win:w,why:y,run:0,or:0,han:0});const g=S.ph=='r';rows.push([meta.no,meta.cat,pl[0]?pn(0):'',pl[1]?pn(1):'',ft(g?S.clk:S.rt),g?'-':ft(S.clk),sc(S.p[0]),sc(S.p[1]),S.sh[0],S.sh[1],pn(w),y]);sv('jrows',rows)}
function aw(s,k){const p=S.p[s];p[k]++;if(k=='ippon'){p.ippon=1;fin(s,'Ippon')}else if(k=='wazaari'&&p.wazaari>=2&&cfg.tachi.ippon){p.ippon=1;fin(s,'Awasete ippon')}else if(S.ph=='g')fin(s,'Golden score')}
function aP(i,k,d){if(!cfg.tachi[k])return;if(d>0){if(S.fin)return;push();aw(i,k);return}const cur=S.p[i][k],nv=Math.max(0,cur+d);if(nv===cur&&!S.fin)return;push();S.p[i][k]=nv;if(S.fin){S.fin=0;S.win=null;S.why=''}}
function aS(i,d){if(d>0){if(S.fin)return;push();if(S.sh[i]>=cfg.ms)return;S.sh[i]++;if(S.sh[i]>=cfg.ms)fin(1-i,'Hansoku-make');else if(S.ph=='g')fin(1-i,'Golden score (shido)');return}const cur=S.sh[i],nv=Math.max(0,cur+d);if(nv===cur&&!S.fin)return;push();S.sh[i]=nv;if(S.fin){S.fin=0;S.win=null;S.why=''}}
const key=p=>[p.ippon,p.wazaari,p.yuko,p.koka];
function endP(){if(S.fin)return;push();Object.assign(S,{run:0,or:0,os:null,ot:0,oa:null});const a=key(S.p[0]),b=key(S.p[1]);let c=0;for(let i=0;i<4&&!c;i++)c=Math.sign(a[i]-b[i]);
  if(c)fin(c>0?0:1,'Punteggio');else if(S.ph=='r')Object.assign(S,{rt:S.clk,ph:'g',clk:0,exp:0,han:0});else Object.assign(S,{han:1,exp:1})}
function tog(){if(S.fin||S.frz)return;if(S.run){Object.assign(S,{run:0,or:0,os:null,ot:0,oa:null})}else if(!S.exp&&!S.han)S.run=1}
function osFreeze(){if(S.fin)return;if(S.frz){S.frz=0;S.or=S.orWas?1:0;if(!S.exp&&!S.han)S.run=1}else if(S.run){S.frz=1;S.orWas=S.or?1:0;S.run=0;S.or=0}}
function oS(i){if(S.fin||S.frz||!S.run)return;if(S.or){if(S.os===i)return;push();if(S.os!==null&&S.oa)S.p[S.os][S.oa]=Math.max(0,S.p[S.os][S.oa]-1);S.os=i;S.oa=null;chO()}else{push();Object.assign(S,{os:i,ot:0,or:1,oa:null})}}
function oFlip(i){if(S.fin||S.frz||!S.run||!S.or||S.os===i)return;push();Object.assign(S,{os:i,ot:0,oa:null})}
var triPend={};
function triTap(i){if(S.fin||S.frz||!S.run)return;if(!S.or||S.os===i){oS(i);return}const k='t'+i;if(triPend[k]){clearTimeout(triPend[k]);delete triPend[k];oFlip(i);return}triPend[k]=setTimeout(()=>{delete triPend[k];oS(i)},350)}
function tk(){if(S.fin||!S.or)return;push();Object.assign(S,{or:0,os:null,ot:0,oa:null});if(S.exp)endP()}
function osStart(){if(S.fin||S.frz||!S.run||S.or)return;push();Object.assign(S,{os:null,ot:0,or:1,oa:null})}
function chO(){if(S.os===null)return;for(const k of ['koka','yuko','wazaari','ippon']){if(!cfg.tachi[k])continue;const c=S.oa;if(S.ot>=cfg.ne[k]&&(c==null||RK[k]>RK[c])){if(c)S.p[S.os][c]=Math.max(0,S.p[S.os][c]-1);S.oa=k;aw(S.os,k);if(S.fin)return}}}
function mW(i){if(S.fin||!confirm('Assegnare la vittoria a '+pn(i)+'?'))return;push();fin(i,'Decisione (hantei/forfait)')}
function un(){if(!undo.length)return;const[a,n]=JSON.parse(undo.pop());S=a;Object.assign(S,{run:0,or:0,os:null,ot:0,oa:null});rows.length=n;sv('jrows',rows)}
function nw(){if(!S.fin&&(S.clk>0||S.rt>0)&&!confirm('Il match in corso non è terminato. Azzerarlo?'))return;if(S.fin&&/^\d+$/.test(meta.no))meta.no=String(+meta.no+1);S=ns();pl=[null,null];undo=[];sv('jmeta',meta);$('#cat').value=meta.cat;$('#no').value=meta.no;[0,1].forEach(sel)}

const INFO=`COME SI USA
• Pannello TV: "Apri pannello TV" apre una seconda scheda (stesso browser/dispositivo). Sul PC trascinala sulla TV e fai doppio clic per il tutto schermo. Su Android usa Chrome › menu › Trasmetti › scheda. Mostra solo i dati confermati, senza ricerche né mouse. Su telefono il pannello e il controllo devono restare nello stesso browser; tieni il controllo in una finestra visibile.
• Tempo: regolamentare a countdown, golden score crescente. Prima voce "Personalizzabile…", poi "No limit", poi i minutaggi di gara.
• Shido: numero di penalità; l'ultima è rossa e assegna la vittoria all'avversario (hansoku-make).
• Punti: spunta i punteggi validi in Tachi waza; in Ne waza imposta i secondi di osaekomi (attivi solo per i punteggi spuntati).
• Match: tocco breve sul tempo avvia/ferma; tenendolo premuto circa mezzo secondo, dopo conferma, chiude il periodo (Fine tempo). I due triangoli ai lati dell'osaekomi lo avviano per Bianco/Blu; un secondo tocco sullo stesso lo ferma. I pallini dello shido e i numeri dei punteggi: un tocco assegna, un secondo tocco ravvicinato toglie. Se il tempo scade durante l'osaekomi, questo continua. 2 waza-ari = ippon. Nel golden score il primo punto o shido decide; se finisce in parità compare in alto a destra, speculare al Menu, il pulsante ⚖ HANTEI: toccalo per assegnare la vittoria.
• Pulsanti sotto il tabellone (nei riquadri Bianco/Blu: OSAE-KOMI, tabella punti/shido, Assegna vittoria) sono nascosti di default; si mostrano dal menu › Pulsanti sotto il tabellone.
• Atleti: cerca per cognome, nome, entrambi in qualsiasi ordine o parte del cognome; Invio o tocco per confermare (senza risultati, Invio inserisce il testo come nome libero).
• Database › importa un CSV/TXT: colonne Cognome; Nome; Nazione; Società; Categoria (con o senza intestazione). Sigla CIO (ITA, GER…) o ISO (IT, DE…): la bandiera appare in automatico (emoji: su Windows possono comparire come lettere).
• Riepilogo: tutti i match conclusi; "Copia CSV" per incollarlo in Excel. Dati salvati nel browser.

Creato da Yanagi Academy.`;
function bt(){[0,1].forEach(i=>{const rows=K.filter(k=>cfg.tachi[k]).map(k=>`<tr id=t${i}${k}><td>${L[k]}<td id=n${i}${k}>${S.p[i][k]}<td><button onclick="aP(${i},'${k}',1)">+</button> <button onclick="aP(${i},'${k}',-1)">−</button>`).join('')+`<tr><td>SHIDO<td id=h${i}>${S.sh[i]}/${cfg.ms}<td><button onclick="aS(${i},1)">+</button> <button onclick="aS(${i},-1)">−</button>`;$('#tb'+i).innerHTML=rows})}

  else if(n=='Hantei')h=`<p><b>HANTEI</b> — il golden score è finito in parità. Assegna la vittoria:</p><p><button onclick="mW(0);document.getElementById('panel').hidden=true">Vince ${esc(pn(0))}</button> <button onclick="mW(1);document.getElementById('panel').hidden=true">Vince ${esc(pn(1))}</button></p>`;
  else if(n=='Riferimenti')h='<p>Tabellone creato da <b>Yanagi Academy</b>.</p><p><a href="https://instagram.com/yanagi_academy" target="_blank" rel="noopener" style="color:#5b8ff0">@yanagi_academy su Instagram</a></p>';
  else if(n=='Info')h='<pre>'+esc(INFO)+'</pre>';

  else if(n=='Riepilogo')h=`<button onclick="navigator.clipboard.writeText(csv()).then(()=>alert('CSV copiato'))">Copia CSV</button> <button onclick="rows.pop();sv('jrows',rows);op('Riepilogo')">Elimina ultima riga</button><table class=s><tr>${HD.map(x=>'<th>'+x+'</th>').join('')}</tr>${rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')}</table>`;
  p.innerHTML=h+`<p><button onclick="document.getElementById('panel').hidden=true">Chiudi</button></p>`;p.hidden=false}
const HD=['N.','Categoria','Bianco','Blu','Tempo reg.','Golden score','Punti Bianco','Punti Blu','Shido B.','Shido Blu','Vincitore','Esito'];

const SY={s:['cognome','surname','lastname'],n:['nome','name','firstname'],f:['atleta','nominativo','fullname'],c:['nazione','naz','country','sigla','nation','paese','ioc','noc'],cl:['societa','club','team','squadra'],k:['categoria','category','peso']};
function imp(f){if(!f)return;f.text().then(t=>{const ln=t.split(/\r?\n/).filter(x=>x.trim());if(!ln.length)return;const d=[';',',','\t','|'].sort((a,b)=>ln[0].split(b).length-ln[0].split(a).length)[0];
  let R=ln.map(l=>l.split(d).map(x=>x.trim().replace(/^"|"$/g,'')));const m={};R[0].forEach((c,i)=>{const z=nz(c).replace(/ /g,'');for(const f in SY)if(SY[f].includes(z)&&!(f in m))m[f]=i});
  if(Object.keys(m).length)R.shift();else Object.assign(m,{s:0,n:1,c:2,cl:3,k:4});const g=(r,f)=>m[f]!=null?(r[m[f]]||''):'';
  const a=R.map(r=>({s:g(r,'s')||g(r,'f'),n:g(r,'n'),c:g(r,'c').toUpperCase(),cl:g(r,'cl'),k:g(r,'k')})).filter(x=>x.s||x.n);
  db=(db.length&&confirm('Sostituire il database attuale ('+db.length+' atleti)? Annulla = aggiungi'))?a:db.concat(a);sv('jdb',db);op('Database')})}
